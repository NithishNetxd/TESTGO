version: 0.0
os: linux

files:
  - source: gobuild
    destination: /opt/Build/
  - source: config.toml
    destination: /opt/Build/

hooks:
  BeforeInstall:
    - location: scripts/BeforeInstall.sh
      timeout: 300
      runas: root

  AfterInstall:
    - location: scripts/AfterInstall.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: scripts/HealthCheck.sh
      timeout: 300
      runas: root
